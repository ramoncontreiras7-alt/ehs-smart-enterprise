name: Auto-Sync EHS Smart Enterprise

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      ambiente:
        description: 'Ambiente de deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - producao

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Validar estrutura
        run: |
          npm ci || npm install
          node -e "const cfg = require('./backend/config.js'); console.log('Versão:', cfg.CFG.VERSAO);"
      
      - name: Lint básico
        run: |
          npx eslint backend/*.js --no-eslintrc --env es6,browser,google-apps-script --parser-options=ecmaVersion:2020 || true

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      
      - name: Configurar clasp
        run: |
          npm install -g @google/clasp
          echo "${{ secrets.CLASP_JSON }}" > backend/.clasp.json
      
      - name: Deploy no Apps Script
        run: |
          cd backend
          clasp push --force
          if [ "${{ github.event.inputs.ambiente }}" == "producao" ]; then
            clasp deploy --description "Deploy produção ${{ github.sha }}"
          else
            clasp deploy --description "Deploy staging ${{ github.sha }}"
          fi
      
      - name: Backup no Google Drive
        uses: ./.github/actions/backup-drive
        with:
          drive-folder-id: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          app-script-id: ${{ secrets.GOOGLE_APPS_SCRIPT_ID }}
      
      - name: Registrar deploy
        run: |
          echo "Deploy realizado: ${{ github.sha }}" >> deploy.log
