name: EHS — Validação e Publicação

# Validação roda em todo envio. Publicação no Apps Script SÓ é feita
# manualmente (aba Actions > "Run workflow"), nunca automaticamente —
# é a porta de homologação do projeto.
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar no Google Apps Script após validar?'
        type: boolean
        default: false

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verificar carga do Apps Script (duplicatas, sintaxe, telas)
        run: node tools/verificar_carga.js backend
      - name: Testes das regras homologadas
        run: npm test

  publicar:
    needs: validar
    if: github.event_name == 'workflow_dispatch' && inputs.publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Conferir credenciais
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Segredo CLASPRC_JSON não configurado (conteúdo do arquivo ~/.clasprc.json do seu PC). Veja o README."
            exit 1
          fi
      - name: Publicar
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          npm install -g @google/clasp@2
          echo "$CLASPRC_JSON" > ~/.clasprc.json
          cd backend
          clasp push --force
          clasp deploy --description "CI ${GITHUB_SHA::7}"
          rm -f ~/.clasprc.json
