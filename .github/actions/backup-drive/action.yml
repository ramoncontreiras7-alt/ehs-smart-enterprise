name: Backup to Google Drive
description: Salva versão do código no Drive
inputs:
  drive-folder-id:
    description: 'ID da pasta no Drive'
    required: true
  app-script-id:
    description: 'ID do projeto Apps Script'
    required: true
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Instalar dependências
      shell: bash
      run: |
        npm install googleapis @google/clasp
        npm install -g @google/clasp
    
    - name: Autenticar no Google
      shell: bash
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      run: |
        echo "$GOOGLE_CREDENTIALS" > credentials.json
        echo "CREDENTIALS_FILE=credentials.json" >> $GITHUB_ENV
    
    - name: Backup do código
      shell: bash
      env:
        DRIVE_FOLDER_ID: ${{ inputs.drive-folder-id }}
      run: |
        node -e "
        const { google } = require('googleapis');
        const fs = require('fs');
        
        async function backup() {
          const auth = new google.auth.GoogleAuth({
            keyFile: process.env.CREDENTIALS_FILE,
            scopes: ['https://www.googleapis.com/auth/drive']
          });
          
          const drive = google.drive({ version: 'v3', auth });
          const timestamp = new Date().toISOString().replace(/:/g, '-').split('.')[0];
          const fileName = 'EHS-Backup-${{ github.sha }}.zip';
          
          // Criar ZIP do código
          const { execSync } = require('child_process');
          execSync('zip -r backup.zip backend/ frontend/ docs/ etl/ package.json');
          
          const fileMetadata = {
            name: fileName,
            parents: [process.env.DRIVE_FOLDER_ID]
          };
          
          const media = {
            mimeType: 'application/zip',
            body: fs.createReadStream('backup.zip')
          };
          
          const response = await drive.files.create({
            resource: fileMetadata,
            media: media,
            fields: 'id, name, webViewLink'
          });
          
          console.log('Arquivo salvo:', response.data.name);
          console.log('ID:', response.data.id);
          console.log('URL:', response.data.webViewLink);
        }
        
        backup().catch(console.error);
        "
